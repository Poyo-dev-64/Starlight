[package]
name = "starlight"
version = "1.0.0"
description = "Starlight — pitch-black constellation music visualizer with synced word-by-star lyrics"
edition = "2021"

[lib]
name = "starlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
reqwest = { version = "0.12", features = ["json"] }
windows = { version = "0.58", features = [
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
